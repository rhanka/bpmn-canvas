name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Ensure the release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Refusing release: ${GITHUB_REF} points to ${GITHUB_SHA}, which is not on origin/main."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Version sanity gate (tag vs package.json)
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          tag_version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ ! "$tag_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$tag' does not match vX.Y.Z." >&2; exit 1
          fi
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::package.json version ($pkg_version) does not match tag ($tag_version)." >&2; exit 1
          fi
          if [[ "$(node -p "require('./package.json').private === true")" == "true" ]]; then
            echo "::error::package.json is still private." >&2; exit 1
          fi
          echo "RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/bpmn-xsd
          key: bpmn-xsd-${{ hashFiles('tests/fixtures/xsd/SOURCE.md') }}

      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

      # Idempotent: a version already on the registry is not published twice.
      # Steady state: npm trusted publishing (OIDC), no token. The very first publish of a new
      # package needs a one-off automation token in the NPM_TOKEN secret, because the trusted
      # publisher can only be attached on npmjs.com once the package exists. Delete the secret
      # after attaching the trusted publisher (see docs/release.md).
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${RELEASE_VERSION} is already on the registry; skipping."
            exit 0
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          npm run build
          npm publish --access public --provenance

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag

      - name: Verify the published package installs and matches
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "${name}@${RELEASE_VERSION}" dist.integrity >/dev/null 2>&1; then break; fi
            sleep 10
          done
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install "${name}@${RELEASE_VERSION}" --no-audit --no-fund
          node --input-type=module -e "const m = await import('${name}'); console.log(Object.keys(m).sort().join(','));"
